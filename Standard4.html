<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شرح معيار 4 — أول 5 أسئلة | محمد السواط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
 --blue:#084B8C; --blue-deep:#054084; --gold:#E8AD28; --gold-l:#F4B12C;
 --green:#059548; --red:#D64541; --ink:#16233C; --muted:#5B6B85; --line:#E9EDF3;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;color:var(--ink);background:#fff;font-size:18px;line-height:1.8}
h1,h2,.brand,.tab,.qnum,.btn{font-family:'Cairo',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* ترويسة */
header{background:var(--blue);color:#fff;padding:12px 0;box-shadow:0 2px 10px rgba(8,75,140,.2)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{height:64px;width:auto;background:#fff;border-radius:12px;padding:5px 12px;box-shadow:0 3px 10px rgba(0,0,0,.18);display:block}
.brand{text-align:right;line-height:1.35}
.brand .nm{font-weight:900;font-size:1.05rem}
.brand .sub{font-size:.72rem;color:#cfe0f2;font-family:'Tajawal'}
.tab{background:var(--gold);color:var(--blue-deep);font-weight:800;font-size:.9rem;padding:4px 16px;border-radius:8px 8px 8px 0}

/* الشريحة */
.slide{display:none;padding:26px 0 90px}
.slide.on{display:block}
.qbar{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.qnum{flex:none;background:var(--blue);color:#fff;font-weight:800;width:46px;height:46px;display:grid;place-items:center;border-radius:12px 12px 0 12px;font-size:1.2rem}
.qtext{font-weight:700;font-size:clamp(1.15rem,2.6vw,1.5rem);position:relative;padding-inline-start:14px}
.qtext::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:5px;background:var(--gold);border-radius:5px}

/* تخطيط: خيارات + لوحة رسم */
.grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:14px}
@media(min-width:900px){.grid.open{grid-template-columns:1fr 1.1fr;align-items:start}}

.opts{display:grid;gap:12px}
.opt{text-align:right;width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;background:#fff;font-size:1.1rem;transition:.15s}
.opt:hover{border-color:var(--blue)}
.opt .letter{flex:none;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-family:'Cairo';font-weight:800;display:grid;place-items:center}
.opt.x{background:#FBF2F1;border-color:#EBC7C4}
.opt.x .letter{background:var(--red)}
.opt.x span:last-child{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2.5px;color:var(--muted)}
.opt.ok{background:#F0FAF4;border-color:var(--green);box-shadow:0 0 0 4px rgba(5,149,72,.15)}
.opt.ok .letter{background:var(--green)}

/* زر إظهار الرسم */
.showbtn{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:var(--blue-deep);font-family:'Cairo';font-weight:800;font-size:1rem;padding:11px 26px;border-radius:12px;box-shadow:0 6px 16px rgba(232,173,40,.35);margin-top:16px;transition:.15s}
.showbtn:hover{transform:translateY(-2px)}
.showbtn.hide{display:none}

/* لوحة الرسم */
.panel{display:none;background:#FAFCFE;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 28px rgba(8,75,140,.08)}
.panel.on{display:block;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.panel h2{color:var(--blue);font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h2::before{content:"";width:14px;height:14px;background:var(--gold);border-radius:4px}
.diagrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.diagrid.one{grid-template-columns:1fr}
.dcard{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;transition:.2s}
.dcard .lbl{font-family:'Cairo';font-weight:800;font-size:.9rem;color:var(--blue);margin-top:6px}
.dcard.dim{opacity:.28;filter:grayscale(.6)}
.dcard.hero{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,149,72,.18)}
.dcard svg{width:100%;height:auto;display:block}
.notecard{background:#fff;border:1.5px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:12px;padding:14px 16px;font-size:.98rem;line-height:1.9}

/* تنقل سفلي */
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--blue);color:#fff;padding:10px 0;z-index:5}
.nav::before{content:"";position:absolute;top:-14px;inset-inline-start:0;border-inline-start:36px solid var(--gold);border-top:14px solid transparent}
.nrow{display:flex;justify-content:space-between;align-items:center}
.nbtn{background:rgba(255,255,255,.14);color:#fff;font-family:'Cairo';font-weight:800;padding:8px 22px;border-radius:10px;font-size:.95rem}
.nbtn:hover{background:rgba(255,255,255,.25)}
.pg{font-size:.9rem;color:#cfe0f2}
.reset{background:none;color:#9db9d6;font-size:.8rem;text-decoration:underline;text-underline-offset:3px}
</style>
</head>

{n:15,text:"الاختصار DNS يعني:",opts:[["أ","dynamic name system",0],["ب","dynamic network system",0],["ج","domain name system",1],["د","domain network service",0]],panel:"طابق حرفًا حرفًا",note:"DNS هو نظام أسماء النطاقات. فخ أسئلة الاختصارات دائمًا كلمة واحدة مبدّلة — طابق كل حرف بكلمته ولا تقرأ بشكل عام."},

{n:17,text:"من أنواع أسلاك الشبكات المستخدمة:",opts:[["أ","الأسلاك المحورية، الأسلاك البصرية",0],["ب","الأسلاك الملتوية، المحورية، البصرية",1],["ج","الأسلاك الملتوية، الأسلاك المحورية",0],["د","لا شيء مما سبق",0]],panel:"القاعدة",note:"أسلاك الشبكات ثلاثة: الملتوية والمحورية والبصرية — والخيار الأكمل هو الصحيح. الفخ: الخيارات الناقصة صحيحة جزئيًا فقط."},
{n:18,text:"البروتوكول الذي طوله 128 بت ويُكتب بالنظام السداسي عشر (Hexadecimal) هو:",opts:[["أ","Tip",0],["ب","IPv4",0],["ج","Rip",0],["د","IPv6",1]],panel:"قارن النسختين بنفسك",diagrams:[["ipvs","الطول 128 بت والكتابة الست عشرية تعني IPv6"]],one:true},
{n:19,text:"أي من التالي يُعد بروتوكولًا موجهًا (Routing Protocol)؟",opts:[["أ","Tip",0],["ب","Voip",0],["ج","Rip",1],["د","Sip",0]],panel:"القاعدة",note:"RIP بروتوكول توجيه معروف تتبادل به الموجهات جداولها. الفخ: SIP وVOIP بروتوكولات صوت لا توجيه."},
{n:20,text:"الطبقة التي تُحدد فيها المواصفات الميكانيكية والكهربائية هي:",opts:[["أ","Physical Layer",1],["ب","Application Layer",0],["ج","Network Layer",0],["د","Data Link",0]],panel:"أسفل الهرم",osi:{hl:6,lbl:"الكهرباء والموصلات والمواصفات الميكانيكية كلها في الطبقة الفيزيائية"},one:true},
{n:21,text:"تُسمى البيانات في طبقة الشبكة (Network Layer) باسم:",opts:[["أ","Packet",1],["ب","Frame",0],["ج","Segment",0],["د","Data",0]],panel:"اسم البيانات يتغير بين الطبقات",osi:{hl:4,lbl:"التدرج: Segment في النقل، ثم Packet في الشبكة، ثم Frame في ربط البيانات"},one:true},
{n:22,text:"الجهاز الذي يتحكم في موارد الشبكة ويزوّد المستخدمين بالخدمات هو:",opts:[["أ","الجهاز العميل",0],["ب","جهاز الرسم",0],["ج","الجهاز الخادم",1],["د","الطابعة",0]],panel:"من يخدم من؟",diagrams:[["clisrv","الخادم يدير الموارد ويقدم الخدمات، والعميل يطلبها فقط"]],one:true},
{n:23,text:"عند استلام ......... رسالة من أحد المنافذ، يقوم بإرسالها إلى جميع المنافذ الأخرى.",opts:[["أ","Repeater مكرر",0],["ب","Hub موزع",1],["ج","Router موجه",0],["د","switch مبدل",0]],panel:"الفرق الجوهري",note:"الموزع (Hub) جهاز بسيط: يستقبل من منفذ ويكرر للجميع بلا تمييز. الفخ: المبدل (Switch) الأذكى يرسل للمنفذ المقصود فقط — وهذا أشهر فرق في أسئلة الأجهزة."},
{n:24,text:"الشبكة التي تربط أجهزة الحاسب بين المدن والبلدان هي:",opts:[["أ","TAN",0],["ب","LAN",0],["ج","NIC",0],["د","WAN",1]],panel:"سلم أحجام الشبكات",diagrams:[["sizes","بين المدن والبلدان = شبكة واسعة"]],one:true},
{n:25,text:"البروتوكول المستخدم في تشفير البيانات هو:",opts:[["أ","SSL",1],["ب","IMTP",0],["ج","SMTP",0],["د","POP",0]],panel:"القاعدة",note:"SSL بروتوكول تشفير البيانات وتأمينها. الفخ: SMTP وPOP بروتوكولا بريد لا تشفير."},
{n:26,text:"الشخص المسؤول عن صيانة وتشغيل الشبكات التي تربط أجهزة الحاسب هو:",opts:[["أ","فني شبكات",1],["ب","مسؤول أمن المعلومات",0],["ج","فني حاسب",0],["د","مطوّر برمجيات",0]],panel:"القاعدة",note:"الوصف يطابق المسمى حرفيًا: صيانة وتشغيل الشبكات وظيفة فني الشبكات. الفخ: فني الحاسب للأجهزة عمومًا لا للشبكات خاصة."},
{n:27,text:"البروتوكول المستخدم لجمع معلومات المستخدمين وعناوين البريد الإلكتروني هو:",opts:[["أ","IMAP",0],["ب","BOOTP",0],["ج","LDAP",1],["د","SNMP",0]],panel:"القاعدة",note:"LDAP دليل مركزي لمعلومات المستخدمين وعناوينهم. الفخ: IMAP يجلب رسائل البريد نفسها، وSNMP يراقب أجهزة الشبكة."},
{n:28,text:"الفرق بين الإيثرنت و الإنترنت هو أن:",opts:[["أ","الإثرنت محلية (داخلية) والإنترنت عالمية (داخلية)",0],["ب","الإثرنت محلية (خارجية) والإنترنت عالمية (خارجية)",0],["ج","الإثرنت محلية (داخلية) والإنترنت عالمية (خارجية)",1],["د","الإثرنت محلية (خارجية) والإنترنت عالمية (داخلية)",0]],panel:"اقرأ بتركيز",note:"القاعدة: الإيثرنت شبكة محلية داخلية، والإنترنت شبكة عالمية خارجية. الفخ: بقية الخيارات تقلب الكلمتين عمدًا — السؤال يختبر تركيزك قبل معلوماتك."},
{n:29,text:"تقوم بمهمة مشابهة للجسر ولكن على طبقات متعددة هي:",opts:[["أ","الموجه",0],["ب","المبدل",0],["ج","الموزع",0],["د","البوابة",1]],panel:"الجسر الأوسع",note:"البوابة (Gateway) تعمل عمل الجسر لكن عبر طبقات متعددة وبين بنى وبروتوكولات مختلفة — مترجم شامل لا مجرد موصل."},
{n:30,text:"أي من العناوين التالية ينتمي إلى الفئة (Class B)؟",opts:[["أ","128.31.170.102",1],["ب","192.168.150.90",0],["ج","10.15.210.80",0],["د","90.198.120.40",0]],panel:"فئات العناوين",diagrams:[["classes","الرقم 128 يقع في مدى الفئة الثانية، بينما 192 من الثالثة و10 و90 من الأولى"]],one:true},
{n:31,text:"مجموعة أجهزة متصلة بالشبكة تتشارك صفحة الويب والطابعة، أحد الأجهزة لا يمكنه الاتصال بالطابعة واتضح أنه يحتاج إلى:",opts:[["أ","DHCP",1],["ب","FTP",0],["ج","HTML",0],["د","SMTP",0]],panel:"القاعدة",note:"جهاز لا يتواصل داخل الشبكة غالبًا بلا عنوان IP — والبروتوكول الذي يوزع العناوين تلقائيًا هو DHCP. الفخ: بقية الخيارات لا علاقة لها بالعنونة."},
{n:32,text:"البروتوكول المسؤول عن تخصيص عناوين الأجهزة في الشبكة هو:",opts:[["أ","SSL",0],["ب","NTP",0],["ج","DHCP",1],["د","POP",0]],panel:"القاعدة",note:"DHCP هو الموزع التلقائي لعناوين IP — نفس قاعدة السؤال السابق بصياغة مباشرة."},
{n:33,text:"البروتوكول المستخدم في نقل البريد الإلكتروني هو:",opts:[["أ","FTP",0],["ب","POP",0],["ج","IMTP",0],["د","SMTP",1]],panel:"إرسال أم استقبال؟",note:"SMTP لإرسال البريد ونقله بين الخوادم. الفخ الأقرب: POP للاستقبال والسحب فقط — فرّق بين الاتجاهين."},
{n:34,text:"الإرسال الذي يحدث من جهاز إلى مجموعة محددة من الأجهزة هو:",opts:[["أ","Broadcast",0],["ب","Unicast",0],["ج","allcast",0],["د","Multicast",1]],panel:"أنواع الإرسال الثلاثة",diagrams:[["cast","لمجموعة محددة يكون الإرسال متعدد الوجهات"]],one:true},
{n:35,text:"الحاسب الذي يقوم بتوصيل البيانات لبقية الأجهزة عبر الإنترنت هو:",opts:[["أ","Clint",0],["ب","Main frame",0],["ج","Server",1],["د","Work group",0]],panel:"من يخدم من؟",diagrams:[["clisrv","من يوصل البيانات ويخدم البقية هو الخادم"]],one:true},
{n:36,text:"ما نوع الإرسال الذي يتم فيه إرسال البيانات من جهاز إلى جميع الأجهزة؟",opts:[["أ","Broadcast",1],["ب","Unicast",0],["ج","Multicast",0],["د","Anycast",0]],panel:"أنواع الإرسال الثلاثة",diagrams:[["cast","للجميع بلا استثناء يكون الإرسال بثًا عامًا"]],one:true},
{n:37,text:"البروتوكول الذي يسمح بإجراء محادثات صوتية عبر الإنترنت هو:",opts:[["أ","Internet Protocol",0],["ب","Network Protocol",0],["ج","VOIP",1],["د","Weblog",0]],panel:"القاعدة",note:"المحادثات الصوتية عبر الشبكة تتم ببروتوكول VOIP أي نقل الصوت عبر بروتوكول الإنترنت."},
{n:38,text:"الجهاز الذي يقوم بتوصيل الأجهزة في شبكة واحدة باستخدام موجات الراديو أو الإشارات اللاسلكية هو:",opts:[["أ","Router",0],["ب","NAP",1],["ج","VOIP",0],["د","HUB",0]],panel:"نقطة الوصول",note:"نقطة الوصول اللاسلكية توصل الأجهزة بموجات الراديو، وهي المقصودة في السؤال. تنبيه علمي: ورد في خيارات السؤال الاختصار NAP، والصحيح قياسيًا AP (Access Point) وهو الاختصار المعتمد لنقطة الوصول اللاسلكية. أما NAP (Network Access Point) فهو نقطة ربط بين الشبكات الكبيرة أو مزودي خدمة الإنترنت لتبادل البيانات، وليس جهاز نقطة وصول لاسلكية."},
{n:39,text:"التقنية التي تعمل على حماية سرية المعلومات أثناء نقلها هي:",opts:[["أ","الشبكة الخاصة الافتراضية VPN",1],["ب","التروجان Trojans",0],["ج","التجزئة",0],["د","التشفير",0]],panel:"تنبيه على القريب من الصح",note:"الإجابة المرجحة: الشبكة الخاصة الافتراضية — منظومة كاملة للنقل الآمن. تنبيه ذكي: التشفير قريب جدًا من الصح فهو الأسلوب الذي تعمل به هذه المنظومة، والفيصل كلمة «أثناء نقلها» التي تشير للتقنية الشاملة لا للأسلوب."},
{n:40,text:"الشبكة التي تربط أجهزة الحاسب في منطقة جغرافية صغيرة هي:",opts:[["أ","NIC",0],["ب","WAN",0],["ج","TAN",0],["د","LAN",1]],panel:"سلم أحجام الشبكات",diagrams:[["sizes","منطقة جغرافية صغيرة = شبكة محلية"]],one:true},
{n:41,text:"البروتوكول المستخدم في معالجة أخطاء الشبكة هو:",opts:[["أ","ICMP",1],["ب","PPTP",0],["ج","SRI",0],["د","VPN",0]],panel:"القاعدة",note:"ICMP بروتوكول رسائل التحكم والأخطاء في الشبكة، ومنه يعمل أمر ping المعروف."},
{n:42,text:"نوع الإرسال الذي يتم فيه نقل البيانات من جهاز واحد إلى جهاز واحد فقط هو:",opts:[["أ","Broadcast",0],["ب","Unicast",1],["ج","Multicast",0],["د","Anycast",0]],panel:"أنواع الإرسال الثلاثة",diagrams:[["cast","جهاز واحد إلى جهاز واحد يكون إرسالًا أحاديًا"]],one:true},
{n:43,text:"الشبكة التي تربط أجهزة في نطاق مدينة كاملة باستخدام الألياف الضوئية أو اللاسلكية هي:",opts:[["أ","WAN",0],["ب","MAN",1],["ج","LAN",0],["د","TAN",0]],panel:"سلم أحجام الشبكات",diagrams:[["sizes","نطاق مدينة كاملة = شبكة المدينة"]],one:true},
{n:44,text:"شبكة خاصة تسمح بدخول مستخدمين خارجيين محددين هي:",opts:[["أ","VBN",0],["ب","WorldNet's",0],["ج","Extranet",1],["د","Intranet",0]],panel:"داخلية أم موسعة؟",note:"القاعدة: Intranet داخلية بحتة لمنسوبي الجهة فقط، وExtranet داخلية تفتح بابًا مضبوطًا بتصريح لخارجيين محددين — كلمة «خارجيين» تحسم السؤال."},
{n:45,text:"التوصيل الذي يتم فيه ربط الأجهزة بمبدّل أو جهاز مركزي يُسمى:",opts:[["أ","توصيل شجري",0],["ب","توصيل خطي",0],["ج","توصيل هرمي",0],["د","توصيل نجمي",1]],panel:"نقطة مركزية = نجمي",diagrams:[["star","جهاز مركزي في الوسط وكل الأجهزة تتصل به مباشرة"]],one:true},
{n:46,text:"شبكة يوجد بها مستودع مركزي ونظام حماية مركزي، ويتم الدخول للملفات والكمبيوترات المتصلة بالشبكة من خلال تصريح معين هي:",opts:[["أ","شبكة العميل/الخادم",1],["ب","شبكة الإثرنت",0],["ج","شبكة الند للند",0],["د","الشبكة المحلية الشخصية(PAN)",0]],panel:"الإدارة المركزية",diagrams:[["clisrv","مستودع مركزي وحماية مركزية وتصاريح دخول تعني شبكة العميل والخادم — عكس الند للند التي لا مركز لها"]],one:true},
{n:47,text:"البروتوكول المستخدم في نقل الملفات عبر الشبكة هو:",opts:[["أ","Tcp",0],["ب","FTP",1],["ج","PPP",0],["د","HTTP",0]],panel:"القاعدة",note:"FTP بروتوكول نقل الملفات — الاسم يفضح الوظيفة. الفخ: HTTP لنقل صفحات الويب لا الملفات عمومًا."},
{n:48,text:"الشهادات التي تُصدرها شركة سيسكو (Cisco) تتعلق بمجال:",opts:[["أ","الدعم الفني",0],["ب","البرمجة",0],["ج","الشبكات",1],["د","قواعد البيانات",0]],panel:"القاعدة",note:"سيسكو الشركة الأشهر عالميًا في أجهزة الشبكات، وشهاداتها كلها في مجال الشبكات."},
{n:49,text:"في هذا النوع من الشبكات تنتقل الإشارة في اتجاه واحد فقط ضمن حلقة مغلقة:",opts:[["أ","Bus topology",0],["ب","Ring Topology",1],["ج","Star topology",0],["د","Mesh topology",0]],panel:"حلقة باتجاه واحد",diagrams:[["ring","اتجاه واحد داخل حلقة مغلقة — قارنها بالخطية ذات الاتجاهين في السؤال الأول"]],one:true},
{n:50,text:"تُعد شبكة WAN شبكة:",opts:[["أ","تتوزع على مباني مجاورة",0],["ب","تربط عدد قليل من أجهزة الحاسب",0],["ج","ممتدة على نطاق واسع",1],["د","تستخدم في الشبكات الشخصية الصغيرة",0]],panel:"سلم أحجام الشبكات",diagrams:[["sizes","الاسم يشرح نفسه: شبكة ممتدة على نطاق واسع"]],one:true},
{n:51,text:"جهاز الربط الشبكي الذي يُعرف باسم المكرر متعدد المحطات هو:",opts:[["أ","المبدل",0],["ب","الجسر",0],["ج","الموجه",0],["د","Active hub المجمع المركزي الفعال",1]],panel:"القاعدة",note:"المجمع المركزي الفعال يقوي الإشارة ويوزعها على كل المنافذ — فهو عمليًا مكرر بعدة محطات، ومن هنا جاءت تسميته."},
{n:52,text:"الشبكة التي تربط شركة داخل مدينة واحدة مثل الدمام تُعد:",opts:[["أ","MAN",1],["ب","WAN",0],["ج","LAN",0],["د","TAN",0]],panel:"سلم أحجام الشبكات",diagrams:[["sizes","المعتمد هنا: داخل مدينة = شبكة المدينة. تنبيه: لو كانت الشركة في مبنى واحد لصارت محلية — القاعدة: جارك محلية، مدينتك مدينية، وبين المدن واسعة"]],one:true},
{n:53,text:"الشبكة التي تربطك بجهاز جارك مباشرة تُعد:",opts:[["أ","WAN",0],["ب","MAN",0],["ج","LAN",1],["د","TAN",0]],panel:"سلم أحجام الشبكات",diagrams:[["sizes","جارك المباشر ضمن النطاق المحلي"]],one:true},
{n:54,text:"البروتوكول SMTP يستخدم المنفذ رقم:",opts:[["أ","80 منفذ",0],["ب","20 منفذ",0],["ج","68 منفذ",0],["د","25 منفذ",1]],panel:"أرقام المنافذ الشهيرة",diagrams:[["ports","بروتوكول الإرسال يستخدم المنفذ 25 — احفظ الثلاثة معًا"]],one:true},
{n:55,text:"الطبقة التي تتحكم في استخدام الشبكة وتمنع التصادم هي:",opts:[["أ","Transmission Layer",0],["ب","Data Link",1],["ج","Physical Layer",0],["د","Network Layer",0]],panel:"مكانها في الهرم",osi:{hl:5,lbl:"التحكم في الوصول للوسط ومنع التصادم مسؤولية طبقة ربط البيانات"},one:true},
{n:56,text:"عمل بروتوكول DNS ضمن الطبقة:",opts:[["أ","Application Layer",1],["ب","Physical Layer",0],["ج","Network Layer",0],["د","Data Link",0]],panel:"أعلى الهرم",osi:{hl:0,lbl:"DNS خدمة يتعامل معها المستخدم مباشرة فتعمل في طبقة التطبيقات"},one:true},
{n:57,text:"اختصار ISDN يشير إلى:",opts:[["أ","Interactive Standard Dynamic Networks",0],["ب","Internet Services Data Network",0],["ج","Integrated Standard Digital Networks",0],["د","Integrated Services Digital Network",1]],panel:"طابق حرفًا حرفًا",note:"ISDN هي الشبكة الرقمية للخدمات المتكاملة. طابق كل حرف بكلمته: متكاملة ثم خدمات ثم رقمية ثم شبكة — الفخ في كل خيار كلمة واحدة مبدلة فقط."},
{n:58,text:"تم تطوير تقنية Wi-Fi من معهد IEEE تحت المعيار رقم:",opts:[["أ","802.16",0],["ب","802.11",1],["ج","802.13",0],["د","802.12",0]],panel:"رقم يحفظ",note:"معيار 802.11 هو الواي فاي قصير المدى. أما 802.16 فهو معيار WiMAX الأوسع نطاقًا — احفظهما كثنائية."},

{n:60,text:"يعمل بروتوكول PPP (Point to Point Protocol) في أي طبقة؟",opts:[["أ","التطبيقات",0],["ب","الفيزيائية",0],["ج","العرض",0],["د","البيانات",1]],panel:"مكانه في الهرم",osi:{hl:5,lbl:"بروتوكول نقطة إلى نقطة يعمل في طبقة ربط البيانات"},one:true},

let cur=0;
const host=document.getElementById("host");

function render(){
 host.innerHTML=S.map((s,si)=>`
 <section class="slide ${si===cur?"on":""}" id="sl${si}">
  <div class="qbar"><div class="qnum">${s.n}</div><div class="qtext">${s.text}</div></div>
  <div class="grid" id="g${si}">
    <div>
      <div class="opts">
        ${s.opts.map((o,oi)=>`<button class="opt" id="o${si}_${oi}" onclick="mark(${si},${oi})">
          <span class="letter">${o[0]}</span><span>${o[1]}</span></button>`).join("")}
      </div>
      ${(s.diagrams||s.osi||s.note)?`<button class="showbtn" id="sb${si}" onclick="openPanel(${si})">${(s.diagrams||s.osi)?"اعرض الرسم التوضيحي":"اعرض القاعدة"}</button>`:""}
    </div>
    <div class="panel" id="p${si}">
      <h2>${s.panel||"القاعدة"}</h2>
      ${(s.note&&!s.diagrams&&!s.osi)?`<div class="notecard">${s.note}</div>`:`<div class="diagrid ${s.one?"one":""}" id="dg${si}">
        ${s.osi
          ? `<div class="dcard"><div id="osi${si}">${SVG.osi(s.osi.hl,s.osi.span)}</div>${s.osi.lbl?`<div class="lbl">${s.osi.lbl}</div>`:""}</div>`
          : s.diagrams.map((d,di)=>`<div class="dcard" id="d${si}_${di}">${SVG[d[0]]}<div class="lbl">${d[1]}</div></div>`).join("")}
      </div>`}
    </div>
  </div>
 </section>`).join("");
 document.getElementById("pg").textContent=`سؤال ${cur+1} من ${S.length}`;
}

function openPanel(si){
 document.getElementById("p"+si).classList.add("on");
 document.getElementById("g"+si).classList.add("open");
 document.getElementById("sb"+si).classList.add("hide");
}

function mark(si,oi){
 const s=S[si], el=document.getElementById(`o${si}_${oi}`), ok=s.opts[oi][2]===1;
 el.classList.remove("x","ok");
 el.classList.add(ok?"ok":"x");
 /* ربط الرسم بالخيار في سؤال التصاميم */
 if(s.map!==undefined && document.getElementById("p"+si).classList.contains("on")){
   const di=s.map[oi], card=document.getElementById(`d${si}_${di}`);
   if(card){ if(ok){card.classList.add("hero");card.classList.remove("dim");} else card.classList.add("dim"); }
 }
}

function resetSlide(){
 const si=cur, s=S[si];
 s.opts.forEach((_,oi)=>document.getElementById(`o${si}_${oi}`).classList.remove("x","ok"));
 if(s.map!==undefined) Object.values(s.map).forEach(di=>{const c=document.getElementById(`d${si}_${di}`);if(c)c.classList.remove("dim","hero")});
}

function move(dir){
 cur=Math.min(S.length-1,Math.max(0,cur+dir));
 document.querySelectorAll(".slide").forEach((e,i)=>e.classList.toggle("on",i===cur));
 document.getElementById("pg").textContent=`سؤال ${cur+1} من ${S.length}`;
 window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(1);
 if(e.key==="ArrowRight")move(-1);
 if(e.key===" "){e.preventDefault();openPanel(cur);}
});

render();
</script>
