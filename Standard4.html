<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شرح معيار 4 — أول 5 أسئلة | محمد السواط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
 --blue:#084B8C; --blue-deep:#054084; --gold:#E8AD28; --gold-l:#F4B12C;
 --green:#059548; --red:#D64541; --ink:#16233C; --muted:#5B6B85; --line:#E9EDF3;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;color:var(--ink);background:#fff;font-size:18px;line-height:1.8}
h1,h2,.brand,.tab,.qnum,.btn{font-family:'Cairo',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* ترويسة */
header{background:var(--blue);color:#fff;padding:12px 0;box-shadow:0 2px 10px rgba(8,75,140,.2)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{height:64px;width:auto;background:#fff;border-radius:12px;padding:5px 12px;box-shadow:0 3px 10px rgba(0,0,0,.18);display:block}
.brand{text-align:right;line-height:1.35}
.brand .nm{font-weight:900;font-size:1.05rem}
.brand .sub{font-size:.72rem;color:#cfe0f2;font-family:'Tajawal'}
.tab{background:var(--gold);color:var(--blue-deep);font-weight:800;font-size:.9rem;padding:4px 16px;border-radius:8px 8px 8px 0}

/* الشريحة */
.slide{display:none;padding:26px 0 90px}
.slide.on{display:block}
.qbar{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.qnum{flex:none;background:var(--blue);color:#fff;font-weight:800;width:46px;height:46px;display:grid;place-items:center;border-radius:12px 12px 0 12px;font-size:1.2rem}
.qtext{font-weight:700;font-size:clamp(1.15rem,2.6vw,1.5rem);position:relative;padding-inline-start:14px}
.qtext::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:5px;background:var(--gold);border-radius:5px}

/* تخطيط: خيارات + لوحة رسم */
.grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:14px}
@media(min-width:900px){.grid.open{grid-template-columns:1fr 1.1fr;align-items:start}}

.opts{display:grid;gap:12px}
.opt{text-align:right;width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;background:#fff;font-size:1.1rem;transition:.15s}
.opt:hover{border-color:var(--blue)}
.opt .letter{flex:none;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-family:'Cairo';font-weight:800;display:grid;place-items:center}
.opt.x{background:#FBF2F1;border-color:#EBC7C4}
.opt.x .letter{background:var(--red)}
.opt.x span:last-child{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2.5px;color:var(--muted)}
.opt.ok{background:#F0FAF4;border-color:var(--green);box-shadow:0 0 0 4px rgba(5,149,72,.15)}
.opt.ok .letter{background:var(--green)}

/* زر إظهار الرسم */
.showbtn{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:var(--blue-deep);font-family:'Cairo';font-weight:800;font-size:1rem;padding:11px 26px;border-radius:12px;box-shadow:0 6px 16px rgba(232,173,40,.35);margin-top:16px;transition:.15s}
.showbtn:hover{transform:translateY(-2px)}
.showbtn.hide{display:none}

/* لوحة الرسم */
.panel{display:none;background:#FAFCFE;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 28px rgba(8,75,140,.08)}
.panel.on{display:block;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.panel h2{color:var(--blue);font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h2::before{content:"";width:14px;height:14px;background:var(--gold);border-radius:4px}
.diagrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.diagrid.one{grid-template-columns:1fr}
.dcard{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;transition:.2s}
.dcard .lbl{font-family:'Cairo';font-weight:800;font-size:.9rem;color:var(--blue);margin-top:6px}
.dcard.dim{opacity:.28;filter:grayscale(.6)}
.dcard.hero{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,149,72,.18)}
.dcard svg{width:100%;height:auto;display:block}

/* تنقل سفلي */
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--blue);color:#fff;padding:10px 0;z-index:5}
.nav::before{content:"";position:absolute;top:-14px;inset-inline-start:0;border-inline-start:36px solid var(--gold);border-top:14px solid transparent}
.nrow{display:flex;justify-content:space-between;align-items:center}
.nbtn{background:rgba(255,255,255,.14);color:#fff;font-family:'Cairo';font-weight:800;padding:8px 22px;border-radius:10px;font-size:.95rem}
.nbtn:hover{background:rgba(255,255,255,.25)}
.pg{font-size:.9rem;color:#cfe0f2}
.reset{background:none;color:#9db9d6;font-size:.8rem;text-decoration:underline;text-underline-offset:3px}
</style>
</head>

let cur=0;
const host=document.getElementById("host");

function render(){
 host.innerHTML=S.map((s,si)=>`
 <section class="slide ${si===cur?"on":""}" id="sl${si}">
  <div class="qbar"><div class="qnum">${s.n}</div><div class="qtext">${s.text}</div></div>
  <div class="grid" id="g${si}">
    <div>
      <div class="opts">
        ${s.opts.map((o,oi)=>`<button class="opt" id="o${si}_${oi}" onclick="mark(${si},${oi})">
          <span class="letter">${o[0]}</span><span>${o[1]}</span></button>`).join("")}
      </div>
      <button class="showbtn" id="sb${si}" onclick="openPanel(${si})">اعرض الرسم التوضيحي</button>
    </div>
    <div class="panel" id="p${si}">
      <h2>${s.panel}</h2>
      <div class="diagrid ${s.one?"one":""}" id="dg${si}">
        ${s.osi
          ? `<div class="dcard"><div id="osi${si}">${SVG.osi(s.osi.hl,s.osi.span)}</div></div>`
          : s.diagrams.map((d,di)=>`<div class="dcard" id="d${si}_${di}">${SVG[d[0]]}<div class="lbl">${d[1]}</div></div>`).join("")}
      </div>
    </div>
  </div>
 </section>`).join("");
 document.getElementById("pg").textContent=`سؤال ${cur+1} من ${S.length}`;
}

function openPanel(si){
 document.getElementById("p"+si).classList.add("on");
 document.getElementById("g"+si).classList.add("open");
 document.getElementById("sb"+si).classList.add("hide");
}

function mark(si,oi){
 const s=S[si], el=document.getElementById(`o${si}_${oi}`), ok=s.opts[oi][2]===1;
 el.classList.remove("x","ok");
 el.classList.add(ok?"ok":"x");
 /* ربط الرسم بالخيار في سؤال التصاميم */
 if(s.map!==undefined && document.getElementById("p"+si).classList.contains("on")){
   const di=s.map[oi], card=document.getElementById(`d${si}_${di}`);
   if(card){ if(ok){card.classList.add("hero");card.classList.remove("dim");} else card.classList.add("dim"); }
 }
}

function resetSlide(){
 const si=cur, s=S[si];
 s.opts.forEach((_,oi)=>document.getElementById(`o${si}_${oi}`).classList.remove("x","ok"));
 if(s.map!==undefined) Object.values(s.map).forEach(di=>{const c=document.getElementById(`d${si}_${di}`);if(c)c.classList.remove("dim","hero")});
}

function move(dir){
 cur=Math.min(S.length-1,Math.max(0,cur+dir));
 document.querySelectorAll(".slide").forEach((e,i)=>e.classList.toggle("on",i===cur));
 document.getElementById("pg").textContent=`سؤال ${cur+1} من ${S.length}`;
 window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(1);
 if(e.key==="ArrowRight")move(-1);
 if(e.key===" "){e.preventDefault();openPanel(cur);}
});

render();
</script>
