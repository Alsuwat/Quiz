<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>سؤال المصفوفات المتداخلة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one stage card, step-driven reveal; navy/gold brand */
:root{
  --navy:#0d1b3e; --navy2:#16295a; --gold:#c9982a; --gold2:#f0c040;
  --ink:#eef1f8; --mute:#9aa6c4; --ok:#2fbf71; --bad:#e2564b; --cell:#1b3166;
  --display:"Cairo",Tajawal,system-ui,sans-serif; --body:"Tajawal","Cairo",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--navy);color:var(--ink);font-family:var(--body);direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;color:var(--gold2);font-size:1.05rem}
.tag{font-size:.85rem;color:var(--navy);background:var(--gold);padding:4px 12px;border-radius:999px;font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,4.5vw,1.9rem);margin:0;text-wrap:balance;line-height:1.4}
h1 b{color:var(--gold2)}
.code{direction:ltr;text-align:left;background:#081230;border:1px solid var(--navy2);border-radius:14px;padding:16px 18px;
  font-family:var(--mono);font-size:clamp(.82rem,2.8vw,1.1rem);line-height:1.9;overflow-x:auto;white-space:pre}
.k{color:#7aa2ff}.n{color:var(--gold2)}.s{color:var(--mute)}
.hl{background:rgba(240,192,64,.18);outline:2px solid var(--gold2);border-radius:4px}
.arrays{display:grid;gap:12px}
.arr{display:flex;align-items:center;gap:10px;direction:ltr}
.arr .lbl{font-family:var(--mono);font-weight:700;font-size:1.3rem;color:var(--gold2);width:28px}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1;min-width:0}
.cell{background:var(--cell);border:2px solid transparent;border-radius:10px;text-align:center;padding:6px 0 4px;transition:.25s}
.cell .v{font-family:var(--mono);font-weight:700;font-size:clamp(1.1rem,4vw,1.6rem)}
.cell .i{font-family:var(--mono);font-size:.75rem;color:var(--mute)}
.cell.on{border-color:var(--gold2);background:#3a3415;transform:translateY(-3px)}
.cell.on .i{color:var(--gold2);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opt{font-family:var(--mono);font-size:clamp(1.3rem,5vw,1.8rem);font-weight:700;background:var(--navy2);color:var(--ink);
  border:2px solid var(--navy2);border-radius:14px;padding:12px 0;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--gold)}
.opt:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.opt.right{background:var(--ok);border-color:var(--ok);color:#06210f}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#2a0805}
.panel{background:var(--navy2);border-radius:16px;padding:16px 18px;min-height:150px;display:flex;flex-direction:column;gap:8px;border-right:4px solid var(--gold)}
.step-no{font-size:.85rem;color:var(--gold2);font-weight:700;letter-spacing:.02em}
.panel h2{font-family:var(--display);margin:0;font-size:clamp(1.1rem,4vw,1.45rem);line-height:1.5}
.panel p{margin:0;font-size:clamp(.98rem,3.4vw,1.15rem);line-height:1.8;color:#d6dcec}
.eq{direction:ltr;text-align:center;font-family:var(--mono);font-weight:700;font-size:clamp(1.3rem,5.5vw,2rem);color:var(--gold2);margin-top:4px}
.eq .dim{color:var(--mute)}
.nav{display:flex;gap:10px;align-items:center;margin-top:auto}
.btn{font-family:var(--display);font-weight:800;font-size:1rem;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}
.next{background:var(--gold);color:var(--navy);flex:1}
.prev{background:transparent;color:var(--mute);border:2px solid var(--navy2)}
.btn:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.dots{display:flex;gap:5px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--navy2)}
.dot.on{background:var(--gold2)}
.board{border:2px dashed var(--gold);border-radius:16px;min-height:300px;position:relative;background:rgba(255,255,255,.02)}
.board::before{content:"مساحة الشرح ✍️";position:absolute;top:10px;right:14px;color:var(--mute);font-size:.85rem}
body.free .panel{display:none}
body.free .board{min-height:420px}
#ink{position:absolute;top:0;left:0;z-index:20;pointer-events:none;touch-action:none}
body.pen #ink{pointer-events:auto;cursor:crosshair}
.tools{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#081230;border-top:2px solid var(--gold);
  display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tb{font-family:var(--display);font-weight:700;font-size:.9rem;background:var(--navy2);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:8px 12px;cursor:pointer}
.tb.on{background:var(--gold);color:var(--navy)}
.tb:focus-visible,.sw:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink);transform:scale(1.15)}
.sep{width:1px;height:26px;background:var(--navy2)}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
@media (max-width:420px){.opts{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <span class="brand">@Alsuwat_edu</span>
    <span class="tag">الرخصة المهنية · حاسب آلي</span>
  </header>

  <h1>جانا في الاختبار 👀 وش <b>المخرج</b> عند تنفيذ المقطع البرمجي؟</h1>

<div class="code" id="code"><span class="k">public static void</span> main(String args[]) {
    <span class="k">int</span>[] x = { <span class="n">1, 2, 3, 4, 5</span> };
    <span class="k">int</span>[] y = { <span class="n">8, 6, 4, 2, 0</span> };
    System.out.println( <span id="partA">x[<span id="inA">y[3]</span>]</span> + <span id="partB">y[<span id="inB">x[1]</span>]</span> );
}</div>

  <div class="arrays" id="arrays">
    <div class="arr"><span class="lbl">x</span><div class="cells" data-arr="x"></div></div>
    <div class="arr"><span class="lbl">y</span><div class="cells" data-arr="y"></div></div>
  </div>

  <div class="opts" id="opts">
    <button class="opt" id="o7" data-v="7">7</button>
    <button class="opt" id="o9" data-v="9">9</button>
    <button class="opt" id="o11" data-v="11">11</button>
    <button class="opt" id="o12" data-v="12">12</button>
  </div>

  <div class="panel" aria-live="polite">
    <span class="step-no" id="stepNo"></span>
    <h2 id="sTitle"></h2>
    <p id="sText"></p>
    <div class="eq" id="sEq"></div>
  </div>

  <div class="nav">
    <button class="btn prev" id="prev">السابق</button>
    <button class="btn next" id="next">التالي</button>
  </div>
  <div class="dots" id="dots"></div>

  <div class="board" id="board"></div>
</div>

<canvas id="ink"></canvas>

<div class="tools" role="toolbar" aria-label="أدوات الكتابة">
  <button class="tb" id="penBtn">✏️ قلم</button>
  <button class="sw on" data-c="#f0c040" style="background:#f0c040" aria-label="ذهبي"></button>
  <button class="sw" data-c="#ffffff" style="background:#ffffff" aria-label="أبيض"></button>
  <button class="sw" data-c="#ff5a4f" style="background:#ff5a4f" aria-label="أحمر"></button>
  <button class="sw" data-c="#36d47f" style="background:#36d47f" aria-label="أخضر"></button>
  <button class="sw" data-c="#6fa8ff" style="background:#6fa8ff" aria-label="أزرق"></button>
  <span class="sep"></span>
  <button class="tb" id="sizeBtn">سماكة: وسط</button>
  <button class="tb" id="undoBtn">↶ تراجع</button>
  <button class="tb" id="clearBtn">🧽 مسح الكل</button>
  <span class="sep"></span>
  <button class="tb" id="freeBtn">إخفاء الشرح الجاهز</button>
</div>

<script>
const X=[1,2,3,4,5], Y=[8,6,4,2,0];
document.querySelectorAll('.cells').forEach(c=>{
  const a=c.dataset.arr==='x'?X:Y;
  c.innerHTML=a.map((v,i)=>`<div class="cell" data-i="${i}"><div class="v">${v}</div><div class="i">[${i}]</div></div>`).join('');
});
const steps=[
 {t:'اختر إجابتك قبل لا نحل 👇',p:'اكتب إجابتك في التعليقات، وبعدين نحلها خطوة خطوة.',eq:'',hl:[],code:null,reveal:false},
 {t:'القاعدة الذهبية: الفهرس (Index) يبدأ من صفر',p:'أول عنصر في المصفوفة (Array) رقمه [0] مو [1]. هذي النقطة اللي يطيح فيها أغلب الناس.',eq:'',hl:[['x',0],['y',0]]},
 {t:'نحل من الداخل للخارج',p:'عندنا أقواس متداخلة. نبدأ بالقوس الداخلي: y[3]',eq:'y[3] = 2',hl:[['y',3]],code:'inA'},
 {t:'نعوّض في القوس الخارجي',p:'صار عندنا x[2]، يعني العنصر الثالث في x',eq:'x[y[3]] = x[2] = 3',hl:[['x',2]],code:'partA'},
 {t:'الطرف الثاني: القوس الداخلي أول',p:'x[1] هو العنصر الثاني في x',eq:'x[1] = 2',hl:[['x',1]],code:'inB'},
 {t:'نعوّض في y',p:'صار عندنا y[2]، يعني العنصر الثالث في y',eq:'y[x[1]] = y[2] = 4',hl:[['y',2]],code:'partB'},
 {t:'نجمع الطرفين',p:'العملية + بين عددين صحيحين (int) تعطي جمع حسابي، مو دمج نصوص.',eq:'3 + 4 = 7',hl:[['x',2],['y',2]],reveal:true},
 {t:'وين الفخ؟ ⚠️',p:'لو عدّيت من 1 بدل 0: y[3] تصير 4 ثم x[4]=5، و x[1] تصير 1 ثم y[1]=6، والمجموع 11. عشان كذا 11 موجود في الخيارات.',eq:'<span class="dim">5 + 6 = 11 ✗</span>',hl:[['x',4],['y',1]],trap:true},
 {t:'الخلاصة',p:'١) الفهرس يبدأ من صفر. ٢) الأقواس المتداخلة: من الداخل للخارج. تابعني لأسئلة الرخصة 🎯',eq:'الإجابة: 7',hl:[],reveal:true}
];
let s=0;
const $=id=>document.getElementById(id);
$('dots').innerHTML=steps.map(()=>'<span class="dot"></span>').join('');
function render(){
  const st=steps[s];
  $('stepNo').textContent=s===0?'السؤال':`الخطوة ${s} من ${steps.length-1}`;
  $('sTitle').textContent=st.t; $('sText').textContent=st.p; $('sEq').innerHTML=st.eq;
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('on'));
  st.hl.forEach(([a,i])=>document.querySelector(`.cells[data-arr="${a}"] .cell[data-i="${i}"]`).classList.add('on'));
  ['inA','partA','inB','partB'].forEach(id=>$(id).classList.toggle('hl',st.code===id));
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('right','wrong'));
  if(st.reveal) $('o7').classList.add('right');
  if(st.trap) $('o11').classList.add('wrong');
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<=s));
  $('prev').disabled=s===0; $('next').textContent=s===steps.length-1?'من البداية':'التالي';
}
$('next').onclick=()=>{s=s===steps.length-1?0:s+1;render()};
$('prev').onclick=()=>{if(s>0){s--;render()}};
document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('right','wrong'));
  o.classList.add(o.dataset.v==='7'?'right':'wrong');
  if(o.dataset.v!=='7') $('o7').classList.add('right');
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key===' '){e.preventDefault();$('next').click()}
  if(e.key==='ArrowRight')$('prev').click();
});
render();

/* ===== طبقة الكتابة ===== */
const cv=$('ink'), ctx=cv.getContext('2d');
let strokes=[], cur=null, color='#f0c040', sizes=[[3,'رفيع'],[6,'وسط'],[12,'عريض']], si=1;
function fit(){
  const w=document.documentElement.scrollWidth, h=Math.max(document.documentElement.scrollHeight,innerHeight), d=devicePixelRatio||1;
  cv.style.width=w+'px'; cv.style.height=h+'px'; cv.width=w*d; cv.height=h*d;
  ctx.setTransform(d,0,0,d,0,0); redraw();
}
function draw(st){
  const p=st.pts; if(!p.length)return;
  ctx.strokeStyle=st.c; ctx.lineWidth=st.w; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]);
  if(p.length===1){ctx.lineTo(p[0][0]+.1,p[0][1]);}
  for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0],p[i][1],mx,my);}
  if(p.length>1)ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);
  ctx.stroke();
}
function redraw(){ctx.clearRect(0,0,cv.width,cv.height);strokes.forEach(draw);if(cur)draw(cur);}
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);cur={c:color,w:sizes[si][0],pts:[pos(e)]};redraw();});
cv.addEventListener('pointermove',e=>{if(!cur)return;cur.pts.push(pos(e));redraw();});
const end=()=>{if(cur){strokes.push(cur);cur=null;}};
cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);

function setPen(on){document.body.classList.toggle('pen',on);$('penBtn').classList.toggle('on',on);$('penBtn').textContent=on?'✏️ القلم شغّال':'✏️ قلم';}
$('penBtn').onclick=()=>setPen(!document.body.classList.contains('pen'));
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{
  color=b.dataset.c;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b));setPen(true);
});
$('sizeBtn').onclick=()=>{si=(si+1)%3;$('sizeBtn').textContent='سماكة: '+sizes[si][1];};
$('undoBtn').onclick=()=>{strokes.pop();redraw();};
$('clearBtn').onclick=()=>{strokes=[];redraw();};
$('freeBtn').onclick=()=>{
  const f=document.body.classList.toggle('free');
  $('freeBtn').classList.toggle('on',f);$('freeBtn').textContent=f?'إظهار الشرح الجاهز':'إخفاء الشرح الجاهز';fit();
};
document.addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'||e.key==='ح')setPen(!document.body.classList.contains('pen'));
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();$('undoBtn').click();}
});
addEventListener('resize',fit);
new ResizeObserver(fit).observe(document.querySelector('.wrap'));
fit();
</script>

</body></html>
